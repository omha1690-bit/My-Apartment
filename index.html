<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2B4257">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>سِجِلّ — إدارة الشقق المؤجرة</title>
<style>
/**
 * Design tokens
 * Palette: calm slate/teal ink tones for a professional, low-fatigue,
 * daily-use dashboard — deliberately avoiding the generic
 * warm-cream/terracotta or near-black/neon combinations.
 * Numbers/currency use a monospace "ledger" face for precision and rhythm;
 * Arabic text uses IBM Plex Sans Arabic throughout.
 */
:root {
  /* Core palette */
  --ink-900: #16222A;      /* primary text */
  --ink-700: #2B4257;      /* primary brand (deep slate-teal) */
  --ink-600: #34586a;
  --teal-600: #2B6F6C;     /* accent / positive actions */
  --teal-500: #35837f;
  --gold-600: #B08D3E;     /* revenue / money accent */
  --gold-100: #FBF3E1;
  --amber-600: #C77D2E;    /* warning */
  --amber-100: #FBEEDD;
  --red-600: #C1483F;      /* danger */
  --red-100: #FBEAE8;
  --green-600: #3F7D58;    /* success */
  --green-100: #E9F4EE;
  --blue-100: #EAF1F5;

  --bg-app: #F3F5F7;
  --bg-surface: #FFFFFF;
  --bg-muted: #F7F8FA;
  --border: #E4E8EC;
  --border-strong: #D3D9DF;

  --text-primary: #1C2530;
  --text-secondary: #5B6572;
  --text-muted: #8A93A2;
  --text-inverse: #FFFFFF;

  /* Typography */
  --font-ar: "IBM Plex Sans Arabic", "Tajawal", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", "Consolas", monospace;

  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-base: 0.9375rem;
  --fs-md: 1.0625rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.5rem;
  --fs-2xl: 1.875rem;

  /* Layout */
  --topbar-h: 56px;
  --bottom-nav-h: 62px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --shadow-sm: 0 1px 2px rgba(22, 34, 42, 0.06);
  --shadow-md: 0 6px 20px rgba(22, 34, 42, 0.08);
  --shadow-lg: 0 16px 40px rgba(22, 34, 42, 0.12);

  --transition-fast: 150ms ease;
  --transition-base: 220ms cubic-bezier(.4,0,.2,1);
  --transition-sheet: 320ms cubic-bezier(.32,.72,0,1);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow-x: hidden; }
body {
  margin: 0;
  overflow-x: hidden;
  font-family: var(--font-ar);
  background: var(--bg-app);
  color: var(--text-primary);
  font-size: var(--fs-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
  -webkit-user-select: none;
  user-select: none;
}
input, textarea, .num, .modal__body p, .modal__body div { -webkit-user-select: text; user-select: text; }
button, a, .chip, .tab-btn { -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
img { max-width: 100%; display: block; }

.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

:focus-visible {
  outline: 2px solid var(--teal-600);
  outline-offset: 2px;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }

/* ---------------------------- App shell layout --------------------------- */
/* Mobile-app shell: fixed top bar + fixed bottom navigation, no sidebar.
   Everything respects the device's safe-area (notch / home-indicator). */
.app-layout {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}
#app-shell { display: contents; }

.brand-mark {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: var(--blue-100);
  border-radius: var(--radius-md);
  color: var(--ink-700);
  flex-shrink: 0;
}
.brand-mark--sm { width: 32px; height: 32px; border-radius: 9px; }

.topbar {
  height: calc(var(--topbar-h) + var(--safe-top));
  padding-top: var(--safe-top);
  display: flex; align-items: center; justify-content: space-between;
  padding-inline: 18px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
  gap: 14px;
  flex-shrink: 0;
}
.topbar__title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar__title h1 { font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar__actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.icon-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  position: relative;
  transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
}
.icon-btn:active { transform: scale(0.92); }

.notif-wrap { position: relative; }
.notif-badge {
  position: absolute; top: -4px; left: -4px;
  background: var(--red-600); color: #fff;
  font-size: 0.65rem; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
}
.notif-panel {
  position: fixed; top: calc(var(--topbar-h) + var(--safe-top) + 6px); left: 12px; right: 12px;
  width: auto; max-height: 60vh; overflow-y: auto;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  opacity: 0; visibility: hidden; transform: translateY(-8px) scale(0.98);
  transition: all var(--transition-base);
  z-index: 50;
}
.notif-panel.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
.notif-panel__head { padding: 14px 16px; font-weight: 700; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.notif-panel__list { display: flex; flex-direction: column; }
.notif-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 13px 16px; font-size: 0.82rem; border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
  transition: background var(--transition-fast);
}
.notif-item:active { background: var(--bg-muted); }
.notif-item:last-child { border-bottom: none; }
.notif-item--danger .icon { color: var(--red-600); }
.notif-item--warning .icon { color: var(--amber-600); }
.notif-empty { padding: 24px 16px; text-align: center; color: var(--text-muted); font-size: 0.85rem; }

.main-content {
  flex: 1;
  padding: 18px 16px calc(var(--bottom-nav-h) + var(--safe-bottom) + 26px);
  max-width: 900px;
  width: 100%;
  margin-inline: auto;
  min-width: 0;
}

/* ------------------------------ Bottom navigation ------------------------- */
.bottom-nav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 30;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: var(--bg-surface);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  box-shadow: 0 -4px 18px rgba(22,34,42,0.06);
}
.bottom-nav__link {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  padding: 9px 2px 8px;
  color: var(--text-muted);
  min-height: 56px;
  position: relative;
  transition: color var(--transition-fast);
}
.bottom-nav__icon { display: flex; transition: transform var(--transition-fast); }
.bottom-nav__label { font-size: 0.63rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bottom-nav__link.active { color: var(--teal-600); }
.bottom-nav__link.active .bottom-nav__icon { transform: translateY(-2px); }
.bottom-nav__link.active::before {
  content: "";
  position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
  width: 22px; height: 3px; border-radius: 999px; background: var(--teal-600);
}
.bottom-nav__link:active { background: var(--bg-muted); }

@media (min-width: 720px) {
  .main-content { max-width: 1400px; }
}


/* ------------------------------- Buttons -------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 0.875rem; font-weight: 600;
  transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
  white-space: nowrap;
  position: relative; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  min-height: 40px;
}
.btn:active { transform: scale(0.97); }
.btn--primary { background: var(--ink-700); color: #fff; }
.btn--primary:hover { background: var(--ink-600); }
.btn--accent { background: var(--teal-600); color: #fff; }
.btn--accent:hover { background: var(--teal-500); }
.btn--ghost { background: transparent; border-color: var(--border-strong); color: var(--text-secondary); }
.btn--ghost:hover { background: var(--bg-muted); }
.btn--danger { background: var(--red-600); color: #fff; }
.btn--danger:hover { background: #a83c34; }
.btn--sm { padding: 8px 12px; font-size: 0.8rem; min-height: 34px; }
.btn--icon { width: 40px; height: 40px; padding: 0; border-radius: var(--radius-sm); background: var(--bg-muted); border-color: var(--border); color: var(--text-secondary); min-height: 40px; }
.btn--icon:hover { background: var(--border); }
.btn--block { width: 100%; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }

/* Material-style ripple feedback, added via JS (see attachRipple) to every
   .btn / .chip / .bottom-nav__link / .tab-btn / .page-btn / .icon-btn tap. */
.ripple-effect {
  position: absolute;
  border-radius: 50%;
  background: rgba(0,0,0,0.14);
  transform: scale(0);
  opacity: 1;
  pointer-events: none;
  animation: rippleAnim 550ms ease-out forwards;
}
@keyframes rippleAnim {
  to { transform: scale(1); opacity: 0; }
}
.chip, .tab-btn, .page-btn, .bottom-nav__link, .icon-btn { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }

/* -------------------------------- Cards ---------------------------------- */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.card__header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 1px solid var(--border);
}
.card__header h3 { font-size: 1rem; }
.card__body { padding: 22px; }

/* --------------------------- Ledger strip (signature) --------------------- */
.ledger-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: var(--ink-700);
  border-radius: var(--radius-lg);
  color: #fff;
  overflow: hidden;
  box-shadow: var(--shadow-md);
  margin-bottom: 22px;
}
.ledger-cell {
  position: relative;
  padding: 20px 18px;
  display: flex; flex-direction: column; gap: 8px;
  transition: background var(--transition-fast);
}
.ledger-cell + .ledger-cell::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 16px; bottom: 16px;
  width: 1px; background: rgba(255,255,255,0.14);
}
.ledger-cell:hover { background: rgba(255,255,255,0.05); }
.ledger-cell__label { font-size: 0.72rem; color: rgba(255,255,255,0.6); display:flex; align-items:center; gap:6px; }
.ledger-cell__value { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 600; direction: ltr; unicode-bidi: isolate; }
.ledger-cell__value.accent-gold { color: #EFD79B; }
.ledger-cell__value.accent-red { color: #F0A79E; }

@media (max-width: 1200px) { .ledger-strip { grid-template-columns: repeat(3, 1fr); } .ledger-cell:nth-child(4)::before,.ledger-cell:nth-child(3n+1)::before{display:none;} }
@media (max-width: 640px) { .ledger-strip { grid-template-columns: repeat(2, 1fr); } .ledger-cell::before{display:none;} }

/* ------------------------------ Stat cards -------------------------------- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: var(--shadow-sm);
}
.stat-card__icon {
  width: 44px; height: 44px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.stat-card__icon.teal { background: var(--blue-100); color: var(--teal-600); }
.stat-card__icon.gold { background: var(--gold-100); color: var(--gold-600); }
.stat-card__icon.red { background: var(--red-100); color: var(--red-600); }
.stat-card__icon.green { background: var(--green-100); color: var(--green-600); }
.stat-card__label { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 3px; }
.stat-card__value { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; direction: ltr; unicode-bidi: isolate; }

/* -------------------------------- Grids/layout ---------------------------- */
.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
@media (max-width: 1100px) { .grid-2 { grid-template-columns: 1fr; } }
.section-gap { margin-bottom: 22px; }

/* -------------------------------- Badges --------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 0.72rem; font-weight: 700;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge--available { background: var(--green-100); color: var(--green-600); }
.badge--rented { background: var(--blue-100); color: var(--teal-600); }
.badge--maintenance { background: var(--amber-100); color: var(--amber-600); }
.badge--overdue { background: var(--red-100); color: var(--red-600); }
.badge--paid { background: var(--green-100); color: var(--green-600); }

/* --------------------------------- Tables --------------------------------- */
.table-wrap { overflow-x: auto; }
table.data-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.data-table thead th {
  text-align: start; padding: 12px 16px;
  color: var(--text-muted); font-weight: 600; font-size: 0.76rem;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table tbody td {
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.data-table tbody tr { transition: background var(--transition-fast); }
.data-table tbody tr:hover { background: var(--bg-muted); }
.data-table tbody tr:last-child td { border-bottom: none; }
.row-actions { display: flex; gap: 6px; }

/* On phone-width screens, tables turn into a stack of cards (one per row)
   instead of scrolling sideways — each cell becomes a labeled line using
   its data-label attribute. */
@media (max-width: 640px) {
  .data-table thead { display: none; }
  .data-table, .data-table tbody, .data-table tr, .data-table td { display: block; width: 100%; }
  .table-wrap { overflow-x: visible; padding: 4px; }
  .data-table tr {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .data-table tr:last-child { margin-bottom: 0; }
  .data-table td {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    text-align: end; white-space: normal;
  }
  .data-table td:last-child { border-bottom: none; }
  .data-table td[data-label]:not([data-label=""])::before {
    content: attr(data-label);
    font-weight: 600; color: var(--text-muted); font-size: 0.72rem; text-align: start; flex-shrink: 0;
  }
  .data-table td[data-label=""] { justify-content: flex-end; padding-top: 12px; }
  .empty-state { padding: 34px 14px; }
}
.cell-strong { font-weight: 600; }
.cell-muted { color: var(--text-muted); }
.avatar-chip {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--blue-100); color: var(--ink-700);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.8rem; flex-shrink: 0;
}
.name-cell { display: flex; align-items: center; gap: 10px; }

.empty-state {
  text-align: center; padding: 50px 20px; color: var(--text-muted);
}
.empty-state .icon { color: var(--border-strong); margin-bottom: 10px; }
.empty-state h4 { color: var(--text-secondary); margin-bottom: 6px; }
.empty-state p { font-size: 0.85rem; }

/* --------------------------------- Forms ---------------------------------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid--3 { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 720px) { .form-grid, .form-grid--3 { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field--full { grid-column: 1 / -1; }
.field label { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); }
.field input, .field select, .field textarea {
  padding: 10px 13px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  color: var(--text-primary);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--teal-600);
  box-shadow: 0 0 0 3px rgba(43,111,108,0.12);
  outline: none;
}
.field textarea { resize: vertical; min-height: 80px; }
.field .hint { font-size: 0.72rem; color: var(--text-muted); }
.field-error { font-size: 0.72rem; color: var(--red-600); }
.field.has-error input, .field.has-error select { border-color: var(--red-600); }

.file-drop {
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--radius-md);
  padding: 18px; text-align: center;
  color: var(--text-muted); font-size: 0.82rem;
  cursor: pointer; transition: border-color var(--transition-fast), background var(--transition-fast);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.file-drop:hover { border-color: var(--teal-600); background: var(--bg-muted); }
.file-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.file-preview img { width: 74px; height: 74px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.file-preview .file-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-muted); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: var(--radius-sm); font-size: 0.78rem;
  position: relative;
}
.file-chip__remove { color: var(--red-600); background: none; border: none; display:flex; }

/* --------------------------------- Modal ---------------------------------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 30, 0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
  opacity: 0; transition: opacity var(--transition-base);
}
.modal-overlay.show { opacity: 1; }
.modal {
  background: var(--bg-surface); border-radius: var(--radius-lg);
  width: 100%; max-width: 640px; max-height: 88vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  transform: translateY(14px); transition: transform var(--transition-base);
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal--sm { max-width: 420px; }
.modal--lg { max-width: 820px; }
.modal__header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 1px solid var(--border);
}
.modal__header h3 { font-size: 1.05rem; }
.modal__body { padding: 22px; overflow-y: auto; -webkit-user-select: text; user-select: text; }
.modal__footer {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 16px 22px; border-top: 1px solid var(--border);
  padding-bottom: calc(16px + var(--safe-bottom));
}

/* --------------------------- Bottom sheet variant -------------------------
   Add/edit forms use this instead of a centered dialog: it slides up from
   the bottom edge, matching native mobile app patterns, and can be
   dismissed by dragging the grabber down. */
.sheet-overlay {
  align-items: flex-end;
  padding: 0;
  background: rgba(15, 23, 30, 0.55);
}
.modal.sheet {
  max-width: 720px;
  max-height: 92vh;
  border-radius: 20px 20px 0 0;
  transform: translateY(100%);
  transition: transform var(--transition-sheet);
  padding-bottom: var(--safe-bottom);
}
.sheet-overlay.show .modal.sheet { transform: translateY(0); }
.sheet__header { padding: 8px 0 0; flex-shrink: 0; }
.sheet__grabber-zone {
  display: flex; justify-content: center; padding: 10px 0 6px; cursor: grab; touch-action: none;
}
.sheet__grabber {
  display: block; width: 40px; height: 5px; border-radius: 999px;
  background: var(--border-strong);
}
.sheet__titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 20px 14px; border-bottom: 1px solid var(--border);

.sheet__titlebar h3 { font-size: 1.05rem; }

/* --------------------------------- Toast ---------------------------------- */
.toast-host {
  position: fixed; bottom: 22px; left: 22px; z-index: 200;
  display: flex; flex-direction: column; gap: 10px;
}
.toast {
  display: flex; align-items: center; gap: 10px;

  padding: 12px 16px; border-radius: var(--radius-sm);
  font-size: 0.85rem; box-shadow: var(--shadow-lg);

  transition: all var(--transition-base);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast--success { background: var(--green-600); }
.toast--error { background: var(--red-600); }

/* --------------------------------- Tabs ------------------------------------ */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tab-btn {
  padding: 10px 16px; background: none; border: none;
  font-size: 0.86rem; color: var(--text-secondary); font-weight: 600;
  border-bottom: 2px solid transparent; margin-bottom: -1px;

}
.tab-btn.active { color: var(--ink-700); border-color: var(--teal-600); }

/* --------------------------------- Toolbar --------------------------------- */
.page-toolbar {
  display: flex; align-items: center; justify-content: space-between;

}
.search-box {
  display: flex; align-items: center; gap: 8px;

.chip {

/* --------------------------------- Pagination ------------------------------ */
.pagination { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 18px; }
.page-btn {
  width: 34px; height: 34px; border-radius: var(--radius-sm);

const STORAGE_KEYS = {

function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

function readTable(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('DB read error', key, e);
    return [];
  }
}

function writeTable(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify(data));
    return true;
  } catch (e) {
    console.error('DB write error', key, e);
    return false;
  }
}

function createRepository(storageKey, entityPrefix) {
  return {
    async getAll() {
      return readTable(storageKey);
    },
    async getById(id) {
      return readTable(storageKey).find((r) => r.id === id) || null;
    },
    async create(record) {
      const rows = readTable(storageKey);
      const newRecord = {
        id: uid(entityPrefix),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        ...record,
      };
      rows.push(newRecord);
      writeTable(storageKey, rows);
      return newRecord;
    },
    async update(id, patch) {
      const rows = readTable(storageKey);
      const idx = rows.findIndex((r) => r.id === id);
      if (idx === -1) return null;
      rows[idx] = { ...rows[idx], ...patch, id, updatedAt: new Date().toISOString() };
      writeTable(storageKey, rows);
      return rows[idx];
    },
    async remove(id) {
      const rows = readTable(storageKey);
      const next = rows.filter((r) => r.id !== id);
      writeTable(storageKey, next);
      return next.length !== rows.length;
    },
    async replaceAll(rows) {
      writeTable(storageKey, rows);
      return rows;
    },
  };
}

  settings: {
    async get() {

        currency: 'ج.م',
        ownerName: 'المالك',
        reminderDaysContract: 30,
        reminderDaysPayment: 5,
        lastBackupAt: null,

      return raw ? { ...defaults, ...JSON.parse(raw) } : defaults;
    },
    async update(patch) {
      const current = await DB.settings.get();
      const next = { ...current, ...patch };
      localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(next));
      return next;
    },
  },

  async exportBackup() {
    const [apartments, tenants, payments, settings] = await Promise.all([
      DB.apartments.getAll(),
      DB.tenants.getAll(),
      DB.payments.getAll(),
      DB.settings.get(),
    ]);
    return {
      meta: {
        app: 'rental-manager',
        version: 1,
        exportedAt: new Date().toISOString(),
      },
      apartments,
      tenants,
      payments,
      settings,
    };
  },

  async importBackup(backup) {
    if (!backup || typeof backup !== 'object') throw new Error('ملف نسخة احتياطية غير صالح');
    if (Array.isArray(backup.apartments)) await DB.apartments.replaceAll(backup.apartments);
    if (Array.isArray(backup.tenants)) await DB.tenants.replaceAll(backup.tenants);
    if (Array.isArray(backup.payments)) await DB.payments.replaceAll(backup.payments);
    if (backup.settings) await DB.settings.update(backup.settings);
    return true;
  },

  async wipeAll() {
    localStorage.removeItem(STORAGE_KEYS.apartments);
    localStorage.removeItem(STORAGE_KEYS.tenants);
    localStorage.removeItem(STORAGE_KEYS.payments);
    return true;
  },

const Utils = {
  formatCurrency(value) {
    const n = Number(value) || 0;
    const formatted = n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    return `<span class="num">${formatted}</span>`;
  },
  formatNumber(value) {
    return `<span class="num">${Number(value) || 0}</span>`;
  },
  formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'numeric' });
  },
  daysBetween(dateA, dateB = new Date()) {
    const a = new Date(dateA);
    const b = new Date(dateB);
    a.setHours(0, 0, 0, 0);
    b.setHours(0, 0, 0, 0);
    return Math.round((a - b) / 86400000);
  },
  /** Whether two date ranges [startA, endA] and [startB, endB] share any day. */
  datesOverlap(startA, endA, startB, endB) {
    const sA = new Date(startA), eA = new Date(endA);
    const sB = new Date(startB), eB = new Date(endB);
    return sA <= eB && sB <= eA;
  },
  escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  },
  debounce(fn, wait = 250) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  },
  fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  },
  async sha256(text) {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  },
  qs(sel, root = document) { return root.querySelector(sel); },
  qsa(sel, root = document) { return Array.from(root.querySelectorAll(sel)); },
};

function toast(message, type = 'info') {
  let host = document.getElementById('toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast-host';
    host.className = 'toast-host';
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  const iconName = type === 'success' ? 'check' : type === 'error' ? 'alert' : 'bell';
  el.innerHTML = `${Icon(iconName, { size: 18 })}<span>${Utils.escapeHtml(message)}</span>`;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, 3200);
}

function confirmDialog({ title = 'تأكيد', message = 'هل أنت متأكد؟', confirmText = 'تأكيد', danger = true }) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal modal--sm" role="alertdialog" aria-modal="true">
        <div class="modal__header">
          <h3>${Utils.escapeHtml(title)}</h3>
        </div>
        <div class="modal__body"><p>${Utils.escapeHtml(message)}</p></div>
        <div class="modal__footer">
          <button class="btn btn--ghost" data-act="cancel">إلغاء</button>
          <button class="btn ${danger ? 'btn--danger' : 'btn--primary'}" data-act="confirm">${Utils.escapeHtml(confirmText)}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));
    function close(result) {
      overlay.classList.remove('show');
      setTimeout(() => overlay.remove(), 200);
      resolve(result);
    }
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) close(false);
      const act = e.target.closest('[data-act]');
      if (act) close(act.dataset.act === 'confirm');
    });
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { close(false); document.removeEventListener('keydown', esc); }
    });
  });
}

function openModal(innerHtml, { size = '' } = {}) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true">${innerHtml}</div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal(overlay);
  });
  overlay.querySelectorAll('[data-close-modal]').forEach((btn) => {
    btn.addEventListener('click', () => closeModal(overlay));
  });
  return overlay;
}
function closeModal(overlay) {
  overlay.classList.remove('show');
  setTimeout(() => overlay.remove(), overlay.classList.contains('sheet-overlay') ? 320 : 200);
}

/** Bottom sheet: same content contract as openModal, but slides up from the
 * bottom edge and can be dragged down (via .sheet__grabber) to dismiss —
 * used for every add/edit form so the app feels native on a phone. */
function openSheet(innerHtml) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay sheet-overlay';
  overlay.innerHTML = `<div class="modal sheet" role="dialog" aria-modal="true">${innerHtml}</div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal(overlay);
  });
  overlay.querySelectorAll('[data-close-modal]').forEach((btn) => {
    btn.addEventListener('click', () => closeModal(overlay));
  });

  const sheetEl = overlay.querySelector('.modal.sheet');
  const grabber = overlay.querySelector('.sheet__grabber-zone');
  if (grabber && sheetEl) {
    let startY = 0, deltaY = 0, dragging = false;
    grabber.addEventListener('pointerdown', (e) => {
      dragging = true;
      startY = e.clientY;
      sheetEl.style.transition = 'none';
      grabber.setPointerCapture(e.pointerId);
    });
    grabber.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      deltaY = Math.max(0, e.clientY - startY);
      sheetEl.style.transform = `translateY(${deltaY}px)`;
    });
    const endDrag = () => {
      if (!dragging) return;
      dragging = false;
      sheetEl.style.transition = '';
      if (deltaY > 90) {
        closeModal(overlay);
      } else {
        sheetEl.style.transform = '';
      }
      deltaY = 0;
    };
    grabber.addEventListener('pointerup', endDrag);
    grabber.addEventListener('pointercancel', endDrag);
  }

  return overlay;
}

const DEFAULT_PASSWORD = 'admin1234';
const SESSION_KEY = 'rm_session';

const Auth = {
  async ensurePasswordSet() {
    const settings = await DB.settings.get();
    if (!settings.passwordHash) {
      const hash = await Utils.sha256(DEFAULT_PASSWORD);
      await DB.settings.update({ passwordHash: hash });
    }
  },
  isLoggedIn() {
    return localStorage.getItem(SESSION_KEY) === '1';
  },
  logout() {
    localStorage.removeItem(SESSION_KEY);
  },
  async login(password) {
    const settings = await DB.settings.get();
    const hash = await Utils.sha256(password);
    if (hash === settings.passwordHash) {
      localStorage.setItem(SESSION_KEY, '1');
      return true;
    }
    return false;
  },
  async changePassword(oldPassword, newPassword) {
    const settings = await DB.settings.get();
    const oldHash = await Utils.sha256(oldPassword);
    if (oldHash !== settings.passwordHash) return false;
    const newHash = await Utils.sha256(newPassword);
    await DB.settings.update({ passwordHash: newHash });
    return true;
  },
};

function drawLineChart(canvas, { labels, values, color = '#2B6F6C', fillColor = 'rgba(43,111,108,0.12)' }) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);

  const padL = 44, padR = 12, padT = 16, padB = 28;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;
  const max = Math.max(1, ...values) * 1.15;

  ctx.strokeStyle = '#E7EAEE';
  ctx.fillStyle = '#8A93A2';
  ctx.font = '11px "IBM Plex Mono", monospace';
  ctx.textAlign = 'right';
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const y = padT + (chartH / steps) * i;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    const val = Math.round(max - (max / steps) * i);
    ctx.fillText(val.toLocaleString('en-US'), padL - 8, y + 3);
  }

  if (values.length === 0) return;
  const stepX = values.length > 1 ? chartW / (values.length - 1) : 0;
  const points = values.map((v, i) => ({
    x: padL + stepX * i,
    y: padT + chartH - (v / max) * chartH,
  }));

  ctx.beginPath();
  ctx.moveTo(points[0].x, padT + chartH);
  points.forEach((p) => ctx.lineTo(p.x, p.y));
  ctx.lineTo(points[points.length - 1].x, padT + chartH);
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();

  ctx.beginPath();
  points.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.fillStyle = color;
  points.forEach((p) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = '#8A93A2';
  ctx.font = '11px "IBM Plex Sans Arabic", sans-serif';
  ctx.textAlign = 'center';
  labels.forEach((lab, i) => {
    ctx.fillText(lab, points[i].x, h - 8);
  });
}

function drawDonutChart(canvas, { segments }) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);

  const total = segments.reduce((s, seg) => s + seg.value, 0) || 1;
  const cx = w / 2, cy = h / 2;
  const outerR = Math.min(w, h) / 2 - 6;
  const innerR = outerR * 0.62;
  let start = -Math.PI / 2;

  segments.forEach((seg) => {
    const angle = (seg.value / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, outerR, start, start + angle);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    start += angle;
  });

  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = '#1C2530';
  ctx.font = '600 20px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(total.toString(), cx, cy - 6);
  ctx.font = '11px "IBM Plex Sans Arabic", sans-serif';
  ctx.fillStyle = '#8A93A2';
  ctx.fillText('إجمالي الشقق', cx, cy + 14);
}

async function mountDashboard() {

  const [apartments, tenants, payments, settings] = await Promise.all([
    DB.apartments.getAll(), DB.tenants.getAll(), DB.payments.getAll(), DB.settings.get(),
  ]);
  const currency = settings.currency;

  const totalApartments = apartments.length;
  const rentedCount = apartments.filter((a) => a.status === 'rented').length;
  const availableCount = apartments.filter((a) => a.status === 'available').length;
  const maintenanceCount = apartments.filter((a) => a.status === 'maintenance').length;
  const contractDays = settings.reminderDaysContract ?? 30;
  const endingSoon = tenants.filter((t) => {
    const d = Utils.daysBetween(t.contractEnd);
    return d >= 0 && d <= contractDays;
  }).length;
  const totalRevenue = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
  const totalDue = tenants.reduce((s, t) => s + Number(t.remainingAmount || 0), 0);

  const ledgerStrip = document.getElementById('ledgerStrip');
  const ledgerData = [
    { label: 'إجمالي الشقق', icon: 'building', value: totalApartments },
    { label: 'شقق مؤجرة', icon: 'check', value: rentedCount },
    { label: 'شقق فارغة', icon: 'home', value: availableCount },
    { label: 'عقود تنتهي قريبًا', icon: 'clock', value: endingSoon, cls: endingSoon ? 'accent-red' : '' },
    { label: 'إجمالي الإيرادات', icon: 'wallet', value: `${totalRevenue.toLocaleString('en-US')} ${currency}`, cls: 'accent-gold' },
    { label: 'مبالغ مستحقة', icon: 'alert', value: `${totalDue.toLocaleString('en-US')} ${currency}`, cls: totalDue ? 'accent-red' : '' },
  ];
  ledgerStrip.innerHTML = ledgerData.map((d, i) => `
    <div class="ledger-cell reveal-item" style="--reveal-delay:${i * 40}ms">
      <span class="ledger-cell__label">${Icon(d.icon, { size: 14 })} ${d.label}</span>
      <span class="ledger-cell__value ${d.cls || ''}">${d.value}</span>
    </div>`).join('');

  const statGrid = document.getElementById('statGrid');
  const stats = [
    { label: 'قيد الصيانة', value: maintenanceCount, icon: 'settings', tone: 'gold' },
    { label: 'عدد المستأجرين', value: tenants.length, icon: 'users', tone: 'teal' },
    { label: 'إجمالي الدفعات المسجّلة', value: payments.length, icon: 'wallet', tone: 'green' },
    { label: 'نسبة الإشغال', value: totalApartments ? `${Math.round((rentedCount / totalApartments) * 100)}%` : '0%', icon: 'grid', tone: 'red' },
  ];
  statGrid.innerHTML = stats.map((s, i) => `
    <div class="stat-card reveal-item" style="--reveal-delay:${i * 40 + 120}ms">
      <div class="stat-card__icon ${s.tone}">${Icon(s.icon, { size: 20 })}</div>
      <div>
        <div class="stat-card__label">${s.label}</div>
        <div class="stat-card__value">${s.value}</div>
      </div>
    </div>`).join('');

  const months = [];
  const monthValues = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const label = d.toLocaleDateString('ar-EG', { month: 'short' });
    const sum = payments
      .filter((p) => {
        const pd = new Date(p.date);
        return pd.getFullYear() === d.getFullYear() && pd.getMonth() === d.getMonth();
      })
      .reduce((s, p) => s + Number(p.amount || 0), 0);
    months.push(label);
    monthValues.push(sum);
  }
  const revenueCanvas = document.getElementById('revenueChart');
  drawLineChart(revenueCanvas, { labels: months, values: monthValues });
  window.addEventListener('resize', Utils.debounce(() => drawLineChart(revenueCanvas, { labels: months, values: monthValues }), 200));

  const occCanvas = document.getElementById('occupancyChart');
  const segments = [
    { label: 'مؤجرة', value: rentedCount, color: '#2B6F6C' },
    { label: 'فارغة', value: availableCount, color: '#3F7D58' },
    { label: 'صيانة', value: maintenanceCount, color: '#C77D2E' },
  ];
  drawDonutChart(occCanvas, { segments });
  window.addEventListener('resize', Utils.debounce(() => drawDonutChart(occCanvas, { segments }), 200));
  document.getElementById('occupancyLegend').innerHTML = segments.map((s) => `
    <span class="text-sm" style="display:flex;align-items:center;gap:6px;">
      <span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block;"></span>
      ${s.label} (${s.value})
    </span>`).join('');

  const latestTenants = [...tenants].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);
  const tbody = document.querySelector('#latestTenantsTable tbody');
  if (latestTenants.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">${Icon('users', { size: 36 })}<h4>لا يوجد مستأجرون بعد</h4><p>أضف أول مستأجر من صفحة المستأجرين</p></div></td></tr>`;
  } else {
    tbody.innerHTML = latestTenants.map((t) => {
      const apt = apartments.find((a) => a.id === t.apartmentId);
      return `<tr>
        <td><div class="name-cell"><span class="avatar-chip">${(t.fullName || '؟').trim()[0] || '؟'}</span><span class="cell-strong">${Utils.escapeHtml(t.fullName)}</span></div></td>
        <td>${apt ? Utils.escapeHtml(apt.name) : '<span class="cell-muted">—</span>'}</td>
        <td>${Utils.formatDate(t.contractStart)}</td>
        <td>${Utils.formatDate(t.contractEnd)}</td>
        <td>${Utils.formatCurrency(t.rentValue)} ${currency}</td>
        <td>${Number(t.remainingAmount) > 0 ? `<span class="badge badge--overdue">${Utils.formatCurrency(t.remainingAmount)}</span>` : `<span class="badge badge--paid">مسدد</span>`}</td>
      </tr>`;
    }).join('');
  }
}

  /** Returns each booking sorted by start date, plus the free gaps between/around them (today onward). */
  function getApartmentSchedule(apartmentId, tenantsList) {
    const bookings = tenantsList
      .filter((t) => t.apartmentId === apartmentId)
      .slice()
      .sort((x, y) => new Date(x.contractStart) - new Date(y.contractStart));

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const free = [];
    let cursor = null;
    bookings.forEach((b) => {
      const start = new Date(b.contractStart);
      const end = new Date(b.contractEnd);
      if (cursor === null) {
        if (start > today) free.push({ start: today, end: start });
      } else if (start > cursor) {
        free.push({ start: cursor, end: start });
      }
      if (cursor === null || end > cursor) cursor = end;
    });
    free.push({ start: cursor && cursor > today ? cursor : today, end: null });

    return { bookings, free };
  }

  function viewApartment(id) {
    const a = apartments.find((x) => x.id === id);
    if (!a) return;
    const { bookings, free } = getApartmentSchedule(id, tenants);

    const bookingsHtml = bookings.length
      ? bookings.map((t) => `
          <div class="flex items-center justify-between" style="padding:10px 0;border-bottom:1px solid var(--border,#eee);">

              <div class="cell-strong">${Utils.escapeHtml(t.fullName)}</div>

          </div>`).join('')
      : `<p class="text-muted text-sm">لا يوجد حجوزات مسجلة على هذه الشقة</p>`;

    const freeHtml = free.length
      ? free.map((f) => `
          <div class="flex items-center justify-between" style="padding:10px 0;border-bottom:1px solid var(--border,#eee);">
            <div class="text-sm">${Utils.formatDate(f.start.toISOString().slice(0, 10))} إلى ${f.end ? Utils.formatDate(f.end.toISOString().slice(0, 10)) : 'غير محدد'}</div>
            <span class="badge badge--available">فاضية</span>
          </div>`).join('')
      : '';

    const overlay = openSheet(`
      <div class="sheet__header">
        <div class="sheet__grabber-zone"><span class="sheet__grabber"></span></div>
        <div class="sheet__titlebar">

      </div>
      <div class="modal__body">

        <h4>الحجوزات</h4>
        ${bookingsHtml}
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" data-close-modal>إغلاق</button>
        <button class="btn btn--primary" id="addBookingBtn">حجز جديد</button>
      </div>
    `);
    overlay.querySelector('#addBookingBtn').addEventListener('click', () => {
      closeModal(overlay);
      window.location.hash = `#/tenants?newFor=${id}`;
    });
  }

  async function deleteApartment(id) {
    const tenants = await DB.tenants.getAll();
    const linkedTenant = tenants.find((t) => t.apartmentId === id);
    if (linkedTenant) {
      toast(`لا يمكن حذف الشقة لوجود مستأجر مرتبط بها (${linkedTenant.fullName})`, 'error');
      return;
    }
    const ok = await confirmDialog({ title: 'حذف الشقة', message: 'سيتم حذف هذه الشقة نهائيًا. هل تريد المتابعة؟', confirmText: 'حذف' });

    await DB.apartments.remove(id);
    toast('تم حذف الشقة', 'success');
    await reload();
  }

  function openApartmentForm(id) {
    const editing = id ? apartments.find((a) => a.id === id) : null;
    let images = editing ? [...(editing.images || [])] : [];

    const overlay = openSheet(`
      <div class="sheet__header">
        <div class="sheet__grabber-zone"><span class="sheet__grabber"></span></div>
        <div class="sheet__titlebar">
          <h3>${editing ? 'تعديل بيانات الشقة' : 'إضافة شقة جديدة'}</h3>
          <button class="btn btn--icon" data-close-modal>${Icon('x', { size: 18 })}</button>
        </div>
      </div>
      <div class="modal__body">
        <form id="aptForm">
          <div class="form-grid">
            <div class="field">
              <label>كود / اسم مختصر للشقة *</label>
              <input type="text" name="code" required value="${Utils.escapeHtml(editing?.code || '')}" placeholder="مثال: A-101">
            </div>
            <div class="field">
              <label>اسم الشقة *</label>
              <input type="text" name="name" required value="${Utils.escapeHtml(editing?.name || '')}" placeholder="مثال: شقة الزهور">
            </div>
            <div class="field field--full">
              <label>العنوان</label>
              <input type="text" name="address" value="${Utils.escapeHtml(editing?.address || '')}" placeholder="العنوان بالتفصيل">
            </div>
            <div class="field">
              <label>عدد الغرف</label>
              <input type="number" name="rooms" min="0" value="${editing?.rooms ?? ''}">
            </div>
            <div class="field">
              <label>السعر الشهري *</label>
              <input type="number" name="price" min="0" step="0.01" required value="${editing?.price ?? ''}">
            </div>
            <div class="field field--full">
              <label>الحالة</label>
              <select name="status">
                <option value="available" ${editing?.status === 'available' ? 'selected' : ''}>متاحة</option>
                <option value="rented" ${editing?.status === 'rented' ? 'selected' : ''}>مؤجرة</option>
                <option value="maintenance" ${editing?.status === 'maintenance' ? 'selected' : ''}>صيانة</option>
              </select>
            </div>
            <div class="field field--full">
              <label>ملاحظات</label>
              <textarea name="notes" placeholder="أي ملاحظات إضافية...">${Utils.escapeHtml(editing?.notes || '')}</textarea>
            </div>
            <div class="field field--full">
              <label>صور الشقة</label>
              <div class="file-drop" id="imgDrop">
                ${Icon('upload', { size: 22 })}
                <span>اضغط لرفع صور الشقة (يمكن اختيار أكثر من صورة)</span>
                <input type="file" id="imgInput" accept="image/*" multiple style="display:none;">
              </div>
              <div class="file-preview" id="imgPreview"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" data-close-modal>إلغاء</button>
        <button class="btn btn--primary" id="saveAptBtn">${editing ? 'حفظ التعديلات' : 'إضافة الشقة'}</button>
      </div>
    `);

    function renderPreview() {
      const wrap = overlay.querySelector('#imgPreview');
      wrap.innerHTML = images.map((src, idx) => `
        <div style="position:relative;">
          <img src="${src}">
          <button type="button" class="file-chip__remove" data-rm-img="${idx}" style="position:absolute;top:-6px;left:-6px;background:#fff;border-radius:50%;box-shadow:var(--shadow-sm);">${Icon('x', { size: 14 })}</button>
        </div>`).join('');
      wrap.querySelectorAll('[data-rm-img]').forEach((btn) => btn.addEventListener('click', () => {
        images.splice(Number(btn.dataset.rmImg), 1);
        renderPreview();
      }));
    }
    renderPreview();

    const dropZone = overlay.querySelector('#imgDrop');
    const imgInput = overlay.querySelector('#imgInput');
    dropZone.addEventListener('click', () => imgInput.click());
    imgInput.addEventListener('change', async () => {
      for (const file of imgInput.files) {
        const base64 = await Utils.fileToBase64(file);
        images.push(base64);
      }
      renderPreview();
      imgInput.value = '';
    });

    overlay.querySelector('#saveAptBtn').addEventListener('click', async () => {
      const form = overlay.querySelector('#aptForm');
      if (!form.reportValidity()) return;
      const fd = new FormData(form);
      const record = {
        code: fd.get('code').trim(),
        name: fd.get('name').trim(),
        address: fd.get('address').trim(),
        rooms: Number(fd.get('rooms')) || 0,
        price: Number(fd.get('price')) || 0,
        status: fd.get('status'),
        notes: fd.get('notes').trim(),
        images,
      };
      if (editing) {
        await DB.apartments.update(editing.id, record);
        toast('تم تحديث بيانات الشقة', 'success');
      } else {
        await DB.apartments.create(record);
        toast('تمت إضافة الشقة بنجاح', 'success');
      }
      closeModal(overlay);
      await reload();
    });
  }

  async function reload() {
    apartments = await DB.apartments.getAll();
    tenants = await DB.tenants.getAll();
    settings = await DB.settings.get();
    renderTable();
  }

  renderToolbar();
  await reload();
}

  function getFiltered() {

              <div class="file-preview" id="idPreview"></div>
            </div>
            <div class="field">
              <label>نسخة العقد</label>
              <div class="file-drop" id="contractDrop">${Icon('upload', { size: 20 })}<span>رفع ملف (صورة أو PDF)</span><input type="file" id="contractInput" accept="image/*,.pdf" style="display:none;"></div>
