        <button class="btn btn--primary" id="saveTenantBtn">${editing ? 'حفظ التعديلات' : 'إضافة المستأجر'}</button>
      </div>
    `);

    function renderIdPreview() {
      const wrap = overlay.querySelector('#idPreview');
      wrap.innerHTML = idImage ? `<div style="position:relative;"><img src="${idImage}"><button type="button" id="rmId" class="file-chip__remove" style="position:absolute;top:-6px;left:-6px;background:#fff;border-radius:50%;">${Icon('x', { size: 14 })}</button></div>` : '';
      const rm = overlay.querySelector('#rmId');
      if (rm) rm.addEventListener('click', () => { idImage = ''; renderIdPreview(); });
    }
    function renderContractPreview() {
      const wrap = overlay.querySelector('#contractPreview');
      wrap.innerHTML = contractFile ? `<span class="file-chip">${Icon('file', { size: 14 })} تم إرفاق الملف <button type="button" id="rmContract" class="file-chip__remove">${Icon('x', { size: 14 })}</button></span>` : '';
      const rm = overlay.querySelector('#rmContract');
      if (rm) rm.addEventListener('click', () => { contractFile = ''; renderContractPreview(); });
    }
    renderIdPreview();
    renderContractPreview();

    overlay.querySelector('#idDrop').addEventListener('click', () => overlay.querySelector('#idInput').click());
    overlay.querySelector('#idInput').addEventListener('change', async (e) => {
      if (e.target.files[0]) { idImage = await Utils.fileToBase64(e.target.files[0]); renderIdPreview(); }
    });
    overlay.querySelector('#contractDrop').addEventListener('click', () => overlay.querySelector('#contractInput').click());
    overlay.querySelector('#contractInput').addEventListener('change', async (e) => {
      if (e.target.files[0]) { contractFile = await Utils.fileToBase64(e.target.files[0]); renderContractPreview(); }
    });

    overlay.querySelector('#saveTenantBtn').addEventListener('click', async () => {
      const form = overlay.querySelector('#tenantForm');
      if (!form.reportValidity()) return;
      const fd = new FormData(form);
      const rentValue = Number(fd.get('rentValue')) || 0;
      const deposit = Number(fd.get('deposit')) || 0;
      const paidAmount = Number(fd.get('paidAmount')) || 0;
      const remainingAmount = Math.max(0, (rentValue + deposit) - paidAmount);
      const newApartmentId = fd.get('apartmentId');
      const newStart = fd.get('contractStart');
      const newEnd = fd.get('contractEnd');

      const conflict = tenants.find((t) =>
        t.apartmentId === newApartmentId &&
        t.id !== editing?.id &&
        Utils.datesOverlap(newStart, newEnd, t.contractStart, t.contractEnd)
      );
      if (conflict) {
        toast(`الشقة محجوزة بالفعل في هذه الفترة باسم "${conflict.fullName}" (${Utils.formatDate(conflict.contractStart).replace(/<[^>]+>/g, '')} إلى ${Utils.formatDate(conflict.contractEnd).replace(/<[^>]+>/g, '')})`, 'error');
        return;
      }

      const record = {
        fullName: fd.get('fullName').trim(),
        phone: fd.get('phone').trim(),
        nationalId: fd.get('nationalId').trim(),
        address: fd.get('address').trim(),
        job: fd.get('job').trim(),
        apartmentId: newApartmentId,
        contractStart: fd.get('contractStart'),
        contractEnd: fd.get('contractEnd'),
        rentValue, deposit, paidAmount, remainingAmount,
        paymentMethod: fd.get('paymentMethod'),
        notes: fd.get('notes').trim(),
        idImage, contractFile,
      };

      if (editing) {
        await DB.tenants.update(editing.id, record);
        toast('تم تحديث بيانات المستأجر', 'success');
      } else {
        const created = await DB.tenants.create(record);
        if (paidAmount > 0) {
          await DB.payments.create({
            tenantId: created.id,
            apartmentId: newApartmentId,
            amount: paidAmount,
            date: record.contractStart || new Date().toISOString().slice(0, 10),
            method: record.paymentMethod,
            note: 'دفعة أولى عند التعاقد',
          });
        }
        toast('تمت إضافة المستأجر بنجاح', 'success');
      }
      closeModal(overlay);
      await reload();
    });
  }

  async function reload() {
    tenants = await DB.tenants.getAll();
    apartments = await DB.apartments.getAll();
    settings = await DB.settings.get();
    renderTable();
  }

  renderToolbar();
  await reload();

  if (params.get('id')) viewTenant(params.get('id'));
  if (params.get('newFor')) openTenantForm(null, params.get('newFor'));
}

async function mountPayments(params) {

  const state = { search: '', tenantFilter: params.get('tenant') || '' };
  let payments = [], tenants = [], apartments = [], settings = null;

  async function recalcTenantBalance(tenantId) {
    const tenant = tenants.find((t) => t.id === tenantId) || await DB.tenants.getById(tenantId);
    if (!tenant) return;
    const allPayments = await DB.payments.getAll();
    const paidTotal = allPayments.filter((p) => p.tenantId === tenantId).reduce((s, p) => s + Number(p.amount || 0), 0);
    const remaining = Math.max(0, (Number(tenant.rentValue) + Number(tenant.deposit)) - paidTotal);
    await DB.tenants.update(tenantId, { paidAmount: paidTotal, remainingAmount: remaining });
  }

  function renderStats() {
    const totalRevenue = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
    const totalDue = tenants.reduce((s, t) => s + Number(t.remainingAmount || 0), 0);
    const thisMonth = payments.filter((p) => {
      const d = new Date(p.date); const n = new Date();
      return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth();
    }).reduce((s, p) => s + Number(p.amount || 0), 0);

    document.getElementById('statGrid').innerHTML = [
      { label: 'إجمالي الإيرادات', value: `${totalRevenue.toLocaleString('en-US')} ${settings.currency}`, icon: 'wallet', tone: 'teal' },
      { label: 'إيرادات هذا الشهر', value: `${thisMonth.toLocaleString('en-US')} ${settings.currency}`, icon: 'dollar', tone: 'green' },
      { label: 'إجمالي المستحقات', value: `${totalDue.toLocaleString('en-US')} ${settings.currency}`, icon: 'alert', tone: 'red' },
      { label: 'عدد الدفعات المسجلة', value: payments.length, icon: 'file', tone: 'gold' },
    ].map((s) => `
      <div class="stat-card">
        <div class="stat-card__icon ${s.tone}">${Icon(s.icon, { size: 20 })}</div>
        <div><div class="stat-card__label">${s.label}</div><div class="stat-card__value">${s.value}</div></div>
      </div>`).join('');
  }

  function renderToolbar() {
    const activeTenant = tenants.find((t) => t.id === state.tenantFilter);
    document.getElementById('toolbarHost').innerHTML = `
      <div class="page-toolbar">
        <div class="search-box">
          ${Icon('search', { size: 17 })}
          <input type="text" id="searchInput" placeholder="ابحث باسم المستأجر أو الشقة...">
        </div>
        ${activeTenant ? `<span class="chip active">تصفية: ${Utils.escapeHtml(activeTenant.fullName)} <button id="clearTenantFilter" style="background:none;border:none;color:inherit;margin-inline-start:6px;">${Icon('x', { size: 12 })}</button></span>` : ''}
        <button class="btn btn--accent" id="addPaymentBtn">${Icon('plus', { size: 17 })}<span>تسجيل دفعة</span></button>
      </div>`;

    document.getElementById('searchInput').value = state.search;
    document.getElementById('searchInput').addEventListener('input', Utils.debounce((e) => {
      state.search = e.target.value.trim();
      renderTable();
    }, 200));
    document.getElementById('addPaymentBtn').addEventListener('click', () => openPaymentForm());
    const clearBtn = document.getElementById('clearTenantFilter');
    if (clearBtn) clearBtn.addEventListener('click', () => {
      state.tenantFilter = '';
      history.replaceState(null, '', window.location.pathname + '#/payments');
      renderToolbar(); renderTable();
    });
  }

  function getFiltered() {
    return payments
      .filter((p) => !state.tenantFilter || p.tenantId === state.tenantFilter)
      .filter((p) => {
        if (!state.search) return true;
        const t = tenants.find((x) => x.id === p.tenantId);
        const a = apartments.find((x) => x.id === p.apartmentId);
        const q = state.search.toLowerCase();
        return [t?.fullName, a?.name, a?.code].some((v) => (v || '').toLowerCase().includes(q));
      })
      .sort((a, b) => new Date(b.date) - new Date(a.date));
  }

  function renderTable() {
    const rows = getFiltered();
    const tbody = document.querySelector('#paymentsTable tbody');
    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">${Icon('wallet', { size: 36 })}<h4>لا توجد دفعات</h4><p>سجّل أول دفعة من هنا</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map((p) => {
      const t = tenants.find((x) => x.id === p.tenantId);
      const a = apartments.find((x) => x.id === p.apartmentId);
      return `<tr class="data-row">
        <td data-label="التاريخ">${Utils.formatDate(p.date)}</td>
        <td data-label="المستأجر" class="cell-strong">${t ? Utils.escapeHtml(t.fullName) : '<span class="cell-muted">مستأجر محذوف</span>'}</td>
        <td data-label="الشقة">${a ? Utils.escapeHtml(a.name) : '—'}</td>
        <td data-label="المبلغ">${Utils.formatCurrency(p.amount)} ${settings.currency}</td>
        <td data-label="طريقة الدفع">${Utils.escapeHtml(p.method || '—')}</td>
        <td data-label="ملاحظات" class="cell-muted">${Utils.escapeHtml(p.note || '—')}</td>
        <td data-label="">
          <div class="row-actions">
            <button class="btn btn--icon" data-edit="${p.id}" title="تعديل">${Icon('edit', { size: 16 })}</button>
            <button class="btn btn--icon" data-del="${p.id}" title="حذف">${Icon('trash', { size: 16 })}</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    Utils.qsa('[data-edit]').forEach((btn) => btn.addEventListener('click', () => openPaymentForm(btn.dataset.edit)));
    Utils.qsa('[data-del]').forEach((btn) => btn.addEventListener('click', () => deletePayment(btn.dataset.del)));
  }

  async function deletePayment(id) {
    const ok = await confirmDialog({ title: 'حذف الدفعة', message: 'سيتم حذف هذه الدفعة وإعادة احتساب رصيد المستأجر. هل تريد المتابعة؟', confirmText: 'حذف' });
    if (!ok) return;
    const p = payments.find((x) => x.id === id);
    await DB.payments.remove(id);
    if (p) await recalcTenantBalance(p.tenantId);
    toast('تم حذف الدفعة', 'success');
    await reload();
  }

  function openPaymentForm(id) {
    const editing = id ? payments.find((p) => p.id === id) : null;
    const overlay = openSheet(`
      <div class="sheet__header">
        <div class="sheet__grabber-zone"><span class="sheet__grabber"></span></div>
        <div class="sheet__titlebar">
          <h3>${editing ? 'تعديل دفعة' : 'تسجيل دفعة جديدة'}</h3>
          <button class="btn btn--icon" data-close-modal>${Icon('x', { size: 18 })}</button>
        </div>
      </div>
      <div class="modal__body">
        <form id="paymentForm">
          <div class="form-grid">
            <div class="field field--full">
              <label>المستأجر *</label>
              <select name="tenantId" required>
                <option value="">اختر المستأجر...</option>
                ${tenants.map((t) => `<option value="${t.id}" ${editing?.tenantId === t.id || (!editing && state.tenantFilter === t.id) ? 'selected' : ''}>${Utils.escapeHtml(t.fullName)}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>المبلغ *</label><input type="number" name="amount" min="0.01" step="0.01" required value="${editing?.amount ?? ''}"></div>
            <div class="field"><label>تاريخ الدفع *</label><input type="date" name="date" required value="${editing?.date || new Date().toISOString().slice(0, 10)}"></div>
            <div class="field field--full">
              <label>طريقة الدفع</label>
              <select name="method">
                <option ${editing?.method === 'نقدًا' ? 'selected' : ''}>نقدًا</option>
                <option ${editing?.method === 'تحويل بنكي' ? 'selected' : ''}>تحويل بنكي</option>
                <option ${editing?.method === 'شيك' ? 'selected' : ''}>شيك</option>
                <option ${editing?.method === 'محفظة إلكترونية' ? 'selected' : ''}>محفظة إلكترونية</option>
              </select>
            </div>
            <div class="field field--full"><label>ملاحظات</label><textarea name="note">${Utils.escapeHtml(editing?.note || '')}</textarea></div>
          </div>
        </form>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" data-close-modal>إلغاء</button>
        <button class="btn btn--primary" id="savePaymentBtn">${editing ? 'حفظ التعديلات' : 'تسجيل الدفعة'}</button>
      </div>
    `);

    overlay.querySelector('#savePaymentBtn').addEventListener('click', async () => {
      const form = overlay.querySelector('#paymentForm');
      if (!form.reportValidity()) return;
      const fd = new FormData(form);
      const tenantId = fd.get('tenantId');
      const tenant = tenants.find((t) => t.id === tenantId);
      const record = {
        tenantId,
        apartmentId: tenant?.apartmentId || '',
        amount: Number(fd.get('amount')) || 0,
        date: fd.get('date'),
        method: fd.get('method'),
        note: fd.get('note').trim(),
      };
      if (editing) {
        const oldTenantId = editing.tenantId;
        await DB.payments.update(editing.id, record);
        await recalcTenantBalance(oldTenantId);
        if (oldTenantId !== tenantId) await recalcTenantBalance(tenantId);
        toast('تم تحديث الدفعة', 'success');
      } else {
        await DB.payments.create(record);
        await recalcTenantBalance(tenantId);
        toast('تم تسجيل الدفعة بنجاح', 'success');
      }
      closeModal(overlay);
      await reload();
    });
  }

  async function reload() {
    payments = await DB.payments.getAll();
    tenants = await DB.tenants.getAll();
    apartments = await DB.apartments.getAll();
    settings = await DB.settings.get();
    renderStats();
    renderToolbar();
    renderTable();
  }

  await reload();
}

async function mountReports() {

  const TITLES = {
    monthly: 'تقرير الإيرادات الشهرية (آخر 12 شهرًا)',
    yearly: 'تقرير الإيرادات السنوية',
    vacant: 'تقرير الشقق الفارغة',
    rented: 'تقرير الشقق المؤجرة',
    expired: 'تقرير العقود المنتهية',
  };

  let apartments = [], tenants = [], payments = [], settings = null;
  let activeTab = 'monthly';
  let currentReport = { headers: [], rows: [] };

  function buildReport(tab) {
    switch (tab) {
      case 'monthly': {
        const headers = ['الشهر', `الإيرادات (${settings.currency})`];
        const rows = [];
        const now = new Date();
        for (let i = 11; i >= 0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          const sum = payments.filter((p) => {
            const pd = new Date(p.date);
            return pd.getFullYear() === d.getFullYear() && pd.getMonth() === d.getMonth();
          }).reduce((s, p) => s + Number(p.amount || 0), 0);
          rows.push([d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long' }), sum]);
        }
        return { headers, rows };
      }
      case 'yearly': {
        const headers = ['السنة', `الإيرادات (${settings.currency})`];
        const years = {};
        payments.forEach((p) => {
          const y = new Date(p.date).getFullYear();
          years[y] = (years[y] || 0) + Number(p.amount || 0);
        });
        const rows = Object.keys(years).sort().map((y) => [y, years[y]]);
        return { headers, rows: rows.length ? rows : [[new Date().getFullYear(), 0]] };
      }
      case 'vacant': {
        const headers = ['الكود', 'الاسم', 'العنوان', 'الغرف', `السعر (${settings.currency})`];
        const rows = apartments.filter((a) => a.status === 'available')
          .map((a) => [a.code, a.name, a.address || '—', a.rooms, a.price]);
        return { headers, rows };
      }
      case 'rented': {
        const headers = ['الكود', 'الاسم', 'المستأجر', 'نهاية العقد', `الإيجار (${settings.currency})`];
        const rows = apartments.filter((a) => a.status === 'rented').map((a) => {
          const t = tenants.find((x) => x.apartmentId === a.id);
          return [a.code, a.name, t?.fullName || '—', t ? Utils.formatDate(t.contractEnd).replace(/<[^>]+>/g, '') : '—', a.price];
        });
        return { headers, rows };
      }
      case 'expired': {
        const headers = ['المستأجر', 'الشقة', 'تاريخ الانتهاء', 'عدد أيام التأخير'];
        const rows = tenants.filter((t) => Utils.daysBetween(t.contractEnd) < 0).map((t) => {
          const a = apartments.find((x) => x.id === t.apartmentId);
          return [t.fullName, a?.name || '—', t.contractEnd, Math.abs(Utils.daysBetween(t.contractEnd))];
        });
        return { headers, rows };
      }
      default:
        return { headers: [], rows: [] };
    }
  }

  function renderTable() {
    document.getElementById('reportTitle').textContent = TITLES[activeTab];
    currentReport = buildReport(activeTab);
    const thead = document.querySelector('#reportTable thead tr');
    const tbody = document.querySelector('#reportTable tbody');
    thead.innerHTML = currentReport.headers.map((h) => `<th>${Utils.escapeHtml(h)}</th>`).join('');
    if (currentReport.rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${currentReport.headers.length}"><div class="empty-state">${Icon('file', { size: 36 })}<h4>لا توجد بيانات لهذا التقرير</h4></div></td></tr>`;
      return;
    }
    tbody.innerHTML = currentReport.rows.map((row) => `<tr>${row.map((cell, i) => `<td data-label="${Utils.escapeHtml(currentReport.headers[i] || '')}">${i === row.length - 1 && typeof cell === 'number' ? Utils.formatCurrency(cell) : Utils.escapeHtml(String(cell))}</td>`).join('')}</tr>`).join('');
  }

  document.querySelectorAll('#reportTabs .tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#reportTabs .tab-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      renderTable();
    });
  });

  document.getElementById('exportExcelBtn').addEventListener('click', () => {
    if (typeof XLSX === 'undefined') { toast('تعذر تحميل مكتبة تصدير Excel، تأكد من الاتصال بالإنترنت', 'error'); return; }
    const ws = XLSX.utils.aoa_to_sheet([currentReport.headers, ...currentReport.rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'التقرير');
    XLSX.writeFile(wb, `${TITLES[activeTab]}.xlsx`);
    toast('تم تصدير التقرير إلى Excel', 'success');
  });

  document.getElementById('exportPdfBtn').addEventListener('click', () => {
    window.print();
  });

  async function reload() {
    apartments = await DB.apartments.getAll();
    tenants = await DB.tenants.getAll();
    payments = await DB.payments.getAll();
    settings = await DB.settings.get();
    renderTable();
  }

  await reload();
}

async function mountSettings() {

  const settings = await DB.settings.get();
  const generalForm = document.getElementById('generalForm');
  generalForm.ownerName.value = settings.ownerName || '';
  generalForm.currency.value = settings.currency || '';
  generalForm.reminderDaysContract.value = settings.reminderDaysContract ?? 30;
  generalForm.reminderDaysPayment.value = settings.reminderDaysPayment ?? 5;

  document.getElementById('lastBackupNote').textContent = settings.lastBackupAt
    ? `آخر نسخة احتياطية: ${Utils.formatDate(settings.lastBackupAt).replace(/<[^>]+>/g, '')}`
    : 'لم يتم إنشاء أي نسخة احتياطية بعد.';

  generalForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    await DB.settings.update({
      ownerName: generalForm.ownerName.value.trim(),
      currency: generalForm.currency.value.trim() || 'ج.م',
      reminderDaysContract: Number(generalForm.reminderDaysContract.value) || 30,
      reminderDaysPayment: Number(generalForm.reminderDaysPayment.value) || 5,
    });
    toast('تم حفظ الإعدادات', 'success');
  });

  const passwordForm = document.getElementById('passwordForm');
  passwordForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const oldPassword = passwordForm.oldPassword.value;
    const newPassword = passwordForm.newPassword.value;
    const confirmPassword = passwordForm.confirmPassword.value;
    if (newPassword !== confirmPassword) {
      toast('كلمة المرور الجديدة وتأكيدها غير متطابقين', 'error');
      return;
    }
    const ok = await Auth.changePassword(oldPassword, newPassword);
    if (ok) {
      toast('تم تغيير كلمة المرور بنجاح', 'success');
      passwordForm.reset();
    } else {
      toast('كلمة المرور الحالية غير صحيحة', 'error');
    }
  });

  document.getElementById('backupBtn').addEventListener('click', async () => {
    const backup = await DB.exportBackup();
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `rental-manager-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    await DB.settings.update({ lastBackupAt: new Date().toISOString() });
    toast('تم إنشاء النسخة الاحتياطية بنجاح', 'success');
  });

  const restoreInput = document.getElementById('restoreInput');
  document.getElementById('restoreBtn').addEventListener('click', async () => {
    const ok = await confirmDialog({
      title: 'استعادة نسخة احتياطية',
      message: 'سيتم استبدال جميع البيانات الحالية بالبيانات الموجودة في الملف المختار. هل تريد المتابعة؟',
      confirmText: 'استعادة',
    });
    if (ok) restoreInput.click();
  });
  restoreInput.addEventListener('change', async () => {
    const file = restoreInput.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const backup = JSON.parse(text);
      await DB.importBackup(backup);
      toast('تمت استعادة النسخة الاحتياطية بنجاح، سيتم إعادة تحميل الصفحة', 'success');
      setTimeout(() => { window.location.hash = '#/dashboard'; renderApp(); }, 1200);
    } catch (err) {
      console.error(err);
      toast('تعذر قراءة ملف النسخة الاحتياطية، تأكد من صحة الملف', 'error');
    }
    restoreInput.value = '';
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    const ok = await confirmDialog({ title: 'تسجيل الخروج', message: 'هل تريد تسجيل الخروج من النظام؟', confirmText: 'خروج', danger: false });
    if (ok) { Auth.logout(); renderApp(); }
  });
}

const NAV_ITEMS = [
  { route: 'dashboard', icon: 'grid', label: 'الرئيسية' },
  { route: 'apartments', icon: 'building', label: 'الشقق' },
  { route: 'tenants', icon: 'users', label: 'المستأجرون' },
  { route: 'payments', icon: 'wallet', label: 'المدفوعات' },
  { route: 'reports', icon: 'file', label: 'التقارير' },
  { route: 'settings', icon: 'settings', label: 'الإعدادات' },
];

const ROUTES = {
  dashboard: { template: () => TEMPLATES.dashboard, mount: mountDashboard },
  apartments: { template: () => TEMPLATES.apartments, mount: mountApartments },
  tenants: { template: () => TEMPLATES.tenants, mount: mountTenants },
  payments: { template: () => TEMPLATES.payments, mount: mountPayments },
  reports: { template: () => TEMPLATES.reports, mount: mountReports },
  settings: { template: () => TEMPLATES.settings, mount: mountSettings },
};

function parseHash() {
  const raw = window.location.hash.replace(/^#\/?/, '');
  const [route, query] = raw.split('?');
  return { route: (route && ROUTES[route]) ? route : 'dashboard', params: new URLSearchParams(query || '') };
}

async function computeNotifications() {
  const [tenants, settings] = await Promise.all([DB.tenants.getAll(), DB.settings.get()]);
  const contractDays = settings.reminderDaysContract ?? 30;
  const notes = [];
  tenants.forEach((t) => {
    const daysLeft = Utils.daysBetween(t.contractEnd);
    if (daysLeft <= contractDays && daysLeft >= 0) {
      notes.push({ icon: 'calendar', tone: daysLeft <= 7 ? 'danger' : 'warning', text: `عقد "${t.fullName}" ينتهي خلال ${daysLeft} يوم`, link: `#/tenants?id=${t.id}` });
    } else if (daysLeft < 0) {
      notes.push({ icon: 'calendar', tone: 'danger', text: `عقد "${t.fullName}" منتهٍ منذ ${Math.abs(daysLeft)} يوم`, link: `#/tenants?id=${t.id}` });
    }
    if (Number(t.remainingAmount) > 0) {
      notes.push({ icon: 'dollar', tone: 'warning', text: `مستحق على "${t.fullName}": ${Number(t.remainingAmount).toLocaleString('en-US')} ${settings.currency}`, link: `#/payments?tenant=${t.id}` });
    }
  });
  return notes;
}

async function renderShell(activeRoute) {
  const shellHost = document.getElementById('app-shell');
  const notes = await computeNotifications();

  shellHost.innerHTML = `
    <header class="topbar">
      <div class="topbar__title">
        <span class="brand-mark brand-mark--sm">${Icon('home', { size: 18 })}</span>
        <h1>${NAV_ITEMS.find((i) => i.route === activeRoute)?.label || ''}</h1>
      </div>
      <div class="topbar__actions">
        <div class="notif-wrap">
          <button class="icon-btn ripple" id="notifBtn" aria-label="التنبيهات">
            ${Icon('bell', { size: 20 })}${notes.length ? `<span class="notif-badge">${notes.length}</span>` : ''}
          </button>
          <div class="notif-panel" id="notifPanel">
            <div class="notif-panel__head">التنبيهات</div>
            <div class="notif-panel__list">
              ${notes.length === 0 ? '<div class="notif-empty">لا توجد تنبيهات حاليًا</div>' : notes.map((n) => `
                <a href="${n.link}" class="notif-item notif-item--${n.tone}">${Icon(n.icon, { size: 16 })}<span>${n.text}</span></a>`).join('')}
            </div>
          </div>
        </div>
      </div>
    </header>
    <nav class="bottom-nav" id="bottomNav">
      ${NAV_ITEMS.map((item) => `
        <a href="#/${item.route}" class="bottom-nav__link ${activeRoute === item.route ? 'active' : ''}">
          <span class="bottom-nav__icon">${Icon(item.icon, { size: 22 })}</span>
          <span class="bottom-nav__label">${item.label}</span>
        </a>`).join('')}
    </nav>`;

  const notifBtn = document.getElementById('notifBtn');
  const notifPanel = document.getElementById('notifPanel');
  notifBtn.addEventListener('click', (e) => { e.stopPropagation(); notifPanel.classList.toggle('show'); });
  document.addEventListener('click', () => notifPanel.classList.remove('show'));
}

function renderLogin() {
  const root = document.getElementById('root');
  root.innerHTML = `<div class="login-page">${TEMPLATES.login}</div>`;
  document.getElementById('brandMark').innerHTML = Icon('home', { size: 26 });
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pass = document.getElementById('password').value;
    const errBox = document.getElementById('loginError');
    const ok = await Auth.login(pass);
    if (ok) {
      renderApp();
    } else {
      errBox.textContent = 'كلمة المرور غير صحيحة، حاول مرة أخرى.';
      errBox.style.display = 'block';
    }
  });
}

async function renderApp() {
  await Auth.ensurePasswordSet();
  await seedIfEmpty();

  if (!Auth.isLoggedIn()) {
    renderLogin();
    return;
  }

  const root = document.getElementById('root');
  if (!document.getElementById('mainContent')) {
    root.innerHTML = `<div class="app-layout"><div id="app-shell"></div><main class="main-content fade-in" id="mainContent"></main></div>`;
  }

  const { route, params } = parseHash();
  await renderShell(route);
  const main = document.getElementById('mainContent');
  main.classList.remove('fade-in');
  main.innerHTML = ROUTES[route].template();
  requestAnimationFrame(() => main.classList.add('fade-in'));
  await ROUTES[route].mount(params);
}

/** Adds a small circular "ripple" at the tap point on any button-like
 * element, using event delegation so it works for elements re-rendered
 * later by the router (no need to re-bind per element). */
function attachRipple() {
  const RIPPLE_SELECTOR = '.btn, .chip, .bottom-nav__link, .icon-btn, .tab-btn, .page-btn';
  document.addEventListener('pointerdown', (e) => {
    const el = e.target.closest(RIPPLE_SELECTOR);
    if (!el || el.disabled) return;
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.8;
    const ripple = document.createElement('span');
    ripple.className = 'ripple-effect';
    ripple.style.width = ripple.style.height = `${size}px`;
    ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
    ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
    el.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });
}

window.addEventListener('hashchange', renderApp);
window.addEventListener('DOMContentLoaded', () => { renderApp(); attachRipple(); });

  </script>
